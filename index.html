<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Skibideria</title>
<style>
  :root {
    --cinza: #85A29E;
    --creme: #FFEBBF;
    --amarelo: #F0D442;
    --laranja: #F59330;
    --vinho: #B22148;
    --texto: #3a1420;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

  body {
    min-height: 100vh;
    background: var(--vinho);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .chat-container {
    width: 100%; max-width: 430px; height: 700px;
    background: var(--amarelo);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    display: flex; flex-direction: column;
  }

  /* CABEÇALHO */
  .chat-header {
    background: var(--laranja); color: var(--texto);
    padding: 18px 20px; display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 48px; height: 48px; background: var(--creme);
    border: 3px solid var(--vinho); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .header-info h2 { font-size: 19px; margin-bottom: 3px; }
  .status { font-size: 13px; }
  .online {
    display: inline-block; width: 8px; height: 8px;
    background: #2e9c4a; border-radius: 50%; margin-right: 5px;
  }

  /* MENSAGENS */
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: var(--creme); }
  .message { display: flex; margin-bottom: 14px; }
  .message.bot { justify-content: flex-start; }
  .message.user { justify-content: flex-end; }
  .message-content {
    max-width: 80%; padding: 12px 15px; border-radius: 15px;
    font-size: 14px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .bot .message-content {
    background: #fff; color: var(--texto);
    border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .user .message-content {
    background: var(--vinho); color: #fff; border-bottom-right-radius: 4px;
  }
  .message-content a { color: var(--vinho); font-weight: bold; }
  .time { display: block; font-size: 10px; margin-top: 5px; opacity: .6; }

  /* DIGITANDO */
  .typing {
    display: none; font-size: 12px; color: var(--texto);
    padding: 6px 20px; background: var(--creme);
  }

  /* OPÇÕES */
  .quick-options { padding: 10px 16px; background: #fff; border-top: 1px solid #eee; }
  .quick-options p { font-size: 12px; color: #6b5a5f; margin-bottom: 8px; }
  .options { display: flex; gap: 7px; flex-wrap: wrap; max-height: 92px; overflow-y: auto; }
  .option {
    border: 1px solid var(--vinho); background: #fff; color: var(--vinho);
    padding: 7px 11px; border-radius: 20px; cursor: pointer; font-size: 12px;
    transition: .2s;
  }
  .option:hover, .option:focus-visible { background: var(--vinho); color: #fff; outline: none; }

  /* INPUT */
  .chat-input {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 15px; background: #fff; border-top: 1px solid #eee;
  }
  .chat-input input {
    flex: 1; border: none; outline: none; background: var(--cinza);
    color: #10201e; border-radius: 25px; padding: 13px 17px; font-size: 14px;
  }
  .chat-input input::placeholder { color: #2f4643; }
  .chat-input input:focus-visible { box-shadow: 0 0 0 2px var(--vinho); }
  .send-button {
    width: 45px; height: 45px; border: none; border-radius: 50%;
    background: var(--vinho); color: #fff; cursor: pointer; font-size: 18px; transition: .2s;
  }
  .send-button:hover { background: #8a1738; transform: scale(1.05); }
  .send-button:focus-visible { outline: 3px solid var(--laranja); }

  @media (max-width: 500px) {
    body { padding: 0; }
    .chat-container { height: 100vh; height: 100dvh; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="logo">🍔</div>
    <div class="header-info">
      <h2>The Skibideria</h2>
      <div class="status"><span class="online"></span>Online • Hamburgueria</div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="typing" id="typing">🍔 Atendente está digitando...</div>

  <div class="quick-options">
    <p>Escolha uma opção:</p>
    <div class="options" id="options"></div>
  </div>

  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off">
    <button class="send-button" id="sendBtn" aria-label="Enviar">➤</button>
  </div>

</div>

<script>
  const CARDAPIO = 'https://ibb.co/23XXKHxJ';
  const link = `<a href="${CARDAPIO}" target="_blank" rel="noopener">${CARDAPIO}</a>`;

  // Respostas de cada área de atendimento
  const respostas = {
    saudacao:   'Olá, como posso ajudar?? 😊',
    endereco:   '📍 <strong>Endereço</strong><br><br>Rua Belterra 291 - Santo Amaro SP',
    entrega:    '🛵 <strong>Entrega</strong><br><br>Entregamos por toda a cidade com uma taxa de R$7,00',
    feedback:   '⭐ <strong>Feedback</strong><br><br>Agradecemos!! Estamos disponíveis para sua próxima compra!',
    finalizacao:'👋 Agradecemos pelo contato!! Volte sempre',
    horario:    '🕕 <strong>Horário</strong><br><br>Trabalhamos das 18h às 23:00',
    pagamento:  '💳 <strong>Pagamento</strong><br><br>Aceitamos cartão de débito e crédito e pix!!',
    precos:     `💰 <strong>Preços</strong><br><br>Consulte nossos preços nesse cardápio:<br>${link}`,
    produtos:   `🍔 <strong>Produtos</strong><br><br>Consulte os produtos nesse cardápio:<br>${link}`,
    padrao:     '🤖 Não entendi muito bem essa pergunta.<br><br>Você pode perguntar sobre <strong>produtos, preços, entrega, pagamento, horário ou endereço</strong>.'
  };

  // Palavras-chave (sem acento, minúsculas). Ordem = prioridade.
  const intencoes = [
    ['finalizacao', ['tchau', 'ate mais', 'ate logo', 'obrigado', 'obrigada', 'valeu', 'finalizar', 'encerrar', 'era isso', 'so isso']],
    ['feedback',    ['feedback', 'avaliar', 'avaliacao', 'elogio', 'reclamacao', 'sugestao', 'opiniao', 'gostei', 'adorei']],
    ['entrega',     ['entrega', 'entregam', 'entregar', 'delivery', 'taxa', 'frete', 'motoboy']],
    ['pagamento',   ['pagamento', 'pagar', 'pix', 'cartao', 'credito', 'debito', 'dinheiro', 'forma de pag']],
    ['horario',     ['horario', 'hora', 'abre', 'aberto', 'fecha', 'funcionamento', 'funciona']],
    ['endereco',    ['endereco', 'localizacao', 'onde fica', 'onde voces', 'local', 'como chegar', 'rua']],
    ['precos',      ['preco', 'precos', 'valor', 'valores', 'quanto custa', 'quanto e', 'quanto fica']],
    ['produtos',    ['produto', 'produtos', 'cardapio', 'menu', 'hamburguer', 'hamburger', 'burger', 'lanche', 'combo', 'batata', 'bebida']],
    ['saudacao',    ['oi', 'ola', 'bom dia', 'boa tarde', 'boa noite', 'e ai', 'eai', 'hello', 'hey']]
  ];

  const botoes = [
    ['Saudação', 'Olá'],
    ['Produtos', 'Quais são os produtos?'],
    ['Preços', 'Quais são os preços?'],
    ['Entrega', 'Vocês fazem entrega?'],
    ['Pagamento', 'Quais formas de pagamento?'],
    ['Horário', 'Qual o horário de funcionamento?'],
    ['Endereço', 'Qual o endereço?'],
    ['Feedback', 'Quero deixar um feedback'],
    ['Finalização', 'Obrigado, era isso']
  ];
  const icones = { 'Saudação':'👋','Produtos':'🍔','Preços':'💰','Entrega':'🛵','Pagamento':'💳','Horário':'🕕','Endereço':'📍','Feedback':'⭐','Finalização':'✅' };

  const chat = document.getElementById('chatMessages');
  const typing = document.getElementById('typing');
  const input = document.getElementById('messageInput');

  const normalizar = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const escapar = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getTime = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  function addMessage(html, type) {
    const m = document.createElement('div');
    m.className = 'message ' + type;
    m.innerHTML = `<div class="message-content">${html}<span class="time">${getTime()}</span></div>`;
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  function detectar(texto) {
    const t = ' ' + normalizar(texto).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ') + ' ';
    for (const [nome, palavras] of intencoes) {
      // palavra inteira: evita "oi" dentro de "moido", por exemplo
      if (palavras.some(p => t.includes(' ' + p + ' ') || (p.length > 4 && t.includes(p)))) return nome;
    }
    return 'padrao';
  }

  function responder(texto) {
    typing.style.display = 'block';
    chat.scrollTop = chat.scrollHeight;
    setTimeout(() => {
      typing.style.display = 'none';
      addMessage(respostas[detectar(texto)], 'bot');
    }, 900);
  }

  function enviar(texto) {
    const t = texto.trim();
    if (!t) return;
    addMessage(escapar(t), 'user');
    responder(t);
  }

  // Botões rápidos
  const boxOpcoes = document.getElementById('options');
  botoes.forEach(([rotulo, msg]) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = `${icones[rotulo]} ${rotulo}`;
    b.onclick = () => enviar(msg);
    boxOpcoes.appendChild(b);
  });

  document.getElementById('sendBtn').onclick = () => { enviar(input.value); input.value = ''; };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { enviar(input.value); input.value = ''; }
  });

  // Mensagem inicial
  addMessage('Olá! 👋<br><br>Bem-vindo(a) à <strong>The Skibideria</strong>.<br><br>' + respostas.saudacao, 'bot');
</script>

</body>
</html>
