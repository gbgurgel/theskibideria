<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Skibideria</title>
<style>
  :root {
    --cinza: #85A29E;
    --creme: #FFEBBF;
    --amarelo: #F0D442;
    --laranja: #F59330;
    --vinho: #B22148;
    --texto: #3a1420;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

  body {
    min-height: 100vh;
    background: var(--vinho);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .chat-container {
    width: 100%; max-width: 430px; height: 700px;
    background: var(--amarelo);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    display: flex; flex-direction: column;
  }

  /* CABEÇALHO */
  .chat-header {
    background: var(--laranja); color: var(--texto);
    padding: 18px 20px; display: flex; align-items: center; gap: 14px;
  }
  .logo {
    width: 48px; height: 48px; background: var(--creme);
    border: 3px solid var(--vinho); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .header-info h2 { font-size: 19px; margin-bottom: 3px; }
  .status { font-size: 13px; }
  .online {
    display: inline-block; width: 8px; height: 8px;
    background: #2e9c4a; border-radius: 50%; margin-right: 5px;
  }

  /* FAIXA DO SITE */
  .site-banner {
    background: var(--vinho); color: #fff; text-align: center;
    font-size: 12px; padding: 8px 12px; line-height: 1.4;
  }
  .site-banner a { color: var(--amarelo); font-weight: bold; text-decoration: underline; }

  /* MENSAGENS */
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: var(--creme); }
  .message { display: flex; margin-bottom: 14px; }
  .message.bot { justify-content: flex-start; }
  .message.user { justify-content: flex-end; }
  .message-content {
    max-width: 80%; padding: 12px 15px; border-radius: 15px;
    font-size: 14px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .bot .message-content {
    background: #fff; color: var(--texto);
    border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .user .message-content {
    background: var(--vinho); color: #fff; border-bottom-right-radius: 4px;
  }
  .message-content a { color: var(--vinho); font-weight: bold; }
  .time { display: block; font-size: 10px; margin-top: 5px; opacity: .6; }

  /* DIGITANDO */
  .typing {
    display: none; font-size: 12px; color: var(--texto);
    padding: 6px 20px; background: var(--creme);
  }

  /* OPÇÕES */
  .quick-options { padding: 10px 16px; background: #fff; border-top: 1px solid #eee; }
  .quick-options p { font-size: 12px; color: #6b5a5f; margin-bottom: 8px; }
  .options { display: flex; gap: 7px; flex-wrap: wrap; max-height: 92px; overflow-y: auto; }
  .option {
    border: 1px solid var(--vinho); background: #fff; color: var(--vinho);
    padding: 7px 11px; border-radius: 20px; cursor: pointer; font-size: 12px;
    transition: .2s;
  }
  .option:hover, .option:focus-visible { background: var(--vinho); color: #fff; outline: none; }

  /* INPUT */
  .chat-input {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 15px; background: #fff; border-top: 1px solid #eee;
  }
  .chat-input input {
    flex: 1; border: none; outline: none; background: var(--cinza);
    color: #10201e; border-radius: 25px; padding: 13px 17px; font-size: 14px;
  }
  .chat-input input::placeholder { color: #2f4643; }
  .chat-input input:focus-visible { box-shadow: 0 0 0 2px var(--vinho); }
  .send-button {
    width: 45px; height: 45px; border: none; border-radius: 50%;
    background: var(--vinho); color: #fff; cursor: pointer; font-size: 18px; transition: .2s;
  }
  .send-button:hover { background: #8a1738; transform: scale(1.05); }
  .send-button:focus-visible { outline: 3px solid var(--laranja); }

  @media (max-width: 500px) {
    body { padding: 0; }
    .chat-container { height: 100vh; height: 100dvh; border-radius: 0; }
  }
</style>
</head>

  const icones = { 'Saudação':'👋','Produtos':'🍔','Preços':'💰','Entrega':'🛵','Pagamento':'💳','Horário':'🕕','Endereço':'📍','Site':'🌐','Feedback':'⭐','Finalização':'✅' };

  // ---------------------------------------------------------------
  // NORMALIZAÇÃO E DETECÇÃO
  // ---------------------------------------------------------------
  const chat = document.getElementById('chatMessages');
  const typing = document.getElementById('typing');
  const input = document.getElementById('messageInput');

  // minúsculas, sem acento, sem pontuação e com letras repetidas reduzidas ("oiii" -> "oi")
  const normalizar = t => t
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/(.)\1+/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();

  const escapar = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getTime = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  // distância de Levenshtein (tolera erros de digitação em palavras maiores)
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  // palavras-chave já normalizadas (sem duplicatas)
  const intencoes = intencoesBrutas.map(([nome, palavras]) => ({
    nome,
    palavras: [...new Set(palavras.map(normalizar).filter(Boolean))]
  }));

  function detectar(texto) {
    const t = normalizar(texto);
    if (!t) return ['padrao'];
    const padded = ' ' + t + ' ';
    const tokens = t.split(' ');
    const achadas = [];

    for (const { nome, palavras } of intencoes) {
      let score = 0;
      for (const p of palavras) {
        if (padded.includes(' ' + p + ' ')) {
          score += p.split(' ').length;                       // frase inteira vale mais
        } else if (!p.includes(' ') && p.length >= 5) {        // erro de digitação
          const tol = p.length >= 8 ? 2 : 1;
          if (tokens.some(tk => tk.length >= 4 && Math.abs(tk.length - p.length) <= tol && lev(tk, p) <= tol)) {
            score += 0.8;
          }
        }
      }
      if (score > 0) achadas.push({ nome, score });
    }

    if (!achadas.length) return ['padrao'];

    // se tem algo específico, ignora as intents sociais (ex.: "oi, qual o horário?")
    const especificas = achadas.filter(a => !SOCIAIS.includes(a.nome));
    const lista = especificas.length ? especificas : achadas;

    lista.sort((a, b) => b.score - a.score || prioridade.indexOf(a.nome) - prioridade.indexOf(b.nome));

    // responde até 2 assuntos de uma vez (ex.: "preço e entrega")
    const top = lista[0].score;
    return lista.filter(a => a.score >= top * 0.5).slice(0, 2).map(a => a.nome);
  }

  // ---------------------------------------------------------------
  // CHAT
  // ---------------------------------------------------------------
  function addMessage(html, type) {
    const m = document.createElement('div');
    m.className = 'message ' + type;
    m.innerHTML = `<div class="message-content">${html}<span class="time">${getTime()}</span></div>`;
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  function responder(texto) {
    typing.style.display = 'block';
    chat.scrollTop = chat.scrollHeight;
    setTimeout(() => {
      typing.style.display = 'none';
      const html = detectar(texto).map(n => respostas[n]()).join('<br><br>');
      addMessage(html, 'bot');
    }, 900);
  }

  function enviar(texto) {
    const t = texto.trim();
    if (!t) return;
    addMessage(escapar(t), 'user');
    responder(t);
  }

  // Botões rápidos
  const boxOpcoes = document.getElementById('options');
  botoes.forEach(([rotulo, msg]) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = `${icones[rotulo]} ${rotulo}`;
    b.onclick = () => enviar(msg);
    boxOpcoes.appendChild(b);
  });

  document.getElementById('sendBtn').onclick = () => { enviar(input.value); input.value = ''; };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { enviar(input.value); input.value = ''; }
  });

  // Mensagem inicial
  addMessage(
    'Olá! 👋<br><br>Bem-vindo(a) à <strong>The Skibideria</strong>.<br><br>' + respostas.saudacao() +
    '<br><br>💡 Dica: no nosso site a experiência é bem melhor! ' + link,
    'bot'
  );
</script>

</body>
</html>
